を、急いでいるからと車いすで運んでしまっていないかなど。","やってみてどうだったかを、自分の口でミーティングや申し送りで報告できているか。うまくいかなかったことも含めて共有し、それで次の対応が変わっているかを見ます。"],3:["起床時間、朝食の内容、好きなテレビ、家事の分担、近所づきあい、趣味、口ぐせ、苦手なことなど、利用前の暮らしぶりを具体的にいくつ挙げられるか。実際に数えてみて、10個くらい言えれば◎の目安です。","全員に同じ手順で行うのではなく、その方の体調・好み・できることに合わせられているか。たとえば刻み方、湯温、トイレ誘導の間隔などを、その人に合わせているかです。","認知症などで言葉にできない気持ちを、スタッフが推し量って言葉にする作業です。「落ち着かないのは、家に帰る時間だと思っているからでは」のように、ミーティングで言い合えているかを見ます。","気づいたことを自分の中で止めず、その場で他のスタッフに伝えたり記録に残したりできているか。「後で言おう」で終わっていないかを振り返ります。","共有された情報を受けて、実際にその日のうちに対応が変わっているか。共有しただけで支援の中身が変わっていなければ「できていない」側になります。"],4:["どんな仕事をして、誰と付き合い、どこに出かけていた方なのか。親しい友人や近所の方、通っていた店や集まりまで把握できているかを見ます。","利用を始めたことで、家族や近所との行き来が途切れていないか。手紙や電話の橋渡し、行事への参加、知人の来訪の受け入れなど、つながりを保つ働きかけができているかです。","自宅にいる時間、夜間、ほかのサービスを使っている時間の様子です。家族や本人から聞き取れているか、24時間の暮らし全体が見えているかを振り返ります。","その方の暮らしを支えてくれる、京町亭以外の人や場所のことです。民生委員、自治会、近所の方、商店、集いの場、移動販売など、具体的に名前を挙げられるかを見ます。"],5:["何でもスタッフが抱え込まず、近所の方や地域の店・団体の力を借りられているか。たとえば買い物を代行するのではなく、なじみの店へ一緒に行って店主にも見守ってもらう、といった形です。","決まった曜日・回数をこなすのではなく、その時の状態や家族の事情に合わせて組み替えられているか。小規模多機能のいちばんの強みが使えているかを見ます。","食事量、歩き方、表情、言葉数などの小さな変化に気づけているか。そしてそれを記録やミーティングでチームの情報にできているかです。","予定どおりに進めることより、その日の体調や気分を優先して変更できているか。「今日は入浴の予定だが調子が悪いので明日にする」といった判断ができているかです。"],6:["主治医、訪問看護、福祉用具業者などと、その方の情報をやりとりできているか。担当者会議だけでなく、電話や訪問での相談も含めて考えてください。","自治会や地域包括支援センター、運営推進委員会などの会議で出た話を、京町亭のスタッフ間で共有できているか。出席した人だけが知っている状態になっていないかを見ます。","地域の行事や団体の活動に出ているか。自治会の清掃、祭り、防災訓練、学校との交流など、小さな関わりも含みます。","利用者以外の人が京町亭に立ち寄る場になっているか。近所の方がお茶を飲みに来る、子どもが通りがかりに寄る、相談に来るなどがあるかを見ます。"],7:["京町亭が地域の中でどんな役割を担うのかを、スタッフ間で話し合えているか。管理者だけが考えている状態になっていないかを振り返ります。","受けた意見や苦情が、記録されて終わりではなく、実際のやり方の変更につながっているか。この1年で何が変わったか思い出せるかを目安にしてください。","近所の方や自治会から寄せられた声（送迎車の停め方、音、においなど）への対応です。聞いた声が改善につながっているかを見ます。","見守り、認知症の啓発、災害時の協力、居場所づくりなど、地域のために何か担えているか。あなた自身がその取組みに関わっているかで選びます。"],8:["この1年で、職場内の勉強会や外部の研修に参加したか。回数ではなく、学ぶ機会を持てているかで判断してください。","介護福祉士や実務者研修などに限らず、興味のある分野の講座や勉強も含みます。参加したくてもできない状況なら低い側を選び、その理由を記述欄に書いてください。","法人内の研修や、市町村・協議会などが開く地域の連絡会に出ているか。案内が回ってきたときに参加できているかを見ます。","事故やヒヤリハットを記録し、原因を話し合い、再発防止につなげているか。感染症対策やBCP（業務継続計画）の確認も含みます。"],9:
